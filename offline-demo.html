<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grok Bot｜异常值离线演练</title>
<style>
:root{--blue:#002fa7;--paper:#fafaf8;--ink:#141519}*{box-sizing:border-box}body{font:18px/1.65 system-ui,"Microsoft YaHei",sans-serif;color:var(--ink);background:var(--paper);margin:0}main{max-width:1120px;padding:48px 28px;margin:auto}.meta{font:650 13px ui-monospace,monospace;letter-spacing:.16em;color:var(--blue)}h1{font-size:clamp(38px,6vw,78px);line-height:1.1;font-weight:300;letter-spacing:-.065em;margin:12px 0 20px}h2{font-size:26px;font-weight:420;margin:30px 0 10px}button{background:var(--blue);color:white;border:1px solid var(--blue);font:inherit;padding:9px 18px;cursor:pointer}button.secondary{background:transparent;color:var(--blue)}label{display:inline-flex;align-items:center;gap:.5em;margin:12px 20px 12px 0}input{width:6em;font:inherit;padding:4px 8px;border:1px solid #888;background:white}table{border-collapse:collapse;width:100%;text-align:left;font-size:16px}th,td{border-top:1px solid #a7abc1;padding:10px 8px;white-space:nowrap}thead{background:#e8ebf5}tfoot{font-size:14px}.scroll{overflow:auto}textarea{display:block;width:100%;height:190px;background:white;color:var(--ink);border:1px solid #777;font:16px/1.55 system-ui,"Microsoft YaHei",sans-serif;padding:12px}a{color:var(--blue)}.valid{color:var(--blue);font-weight:700}.status{min-height:1.65em;color:var(--blue)}[hidden]{display:none!important}
</style></head><body><main><div class="meta">长沙主题实战版　/　P04　/　离线演练</div><h1>这四条，你跟哪一条？</h1><p>所有数据均为教学模拟，用小红书笔记举例。同作者、同平台，统一使用发布后 24 小时的点赞数。至少 5 条同口径历史样本才算，零基线不计算倍数。</p>
<div class="scroll"><table><thead><tr><th>作者</th><th>本帖点赞</th><th>历史中位数</th><th>当前 / 历史观察窗</th><th>历史样本</th></tr></thead><tbody>
<tr><td>甲</td><td>550</td><td>40</td><td>24h / 24h</td><td>10</td></tr>
<tr><td>乙</td><td>5000</td><td>5000</td><td>24h / 24h</td><td>10</td></tr>
<tr><td>丙</td><td>900</td><td>60</td><td>48h / 24h</td><td>10</td></tr>
<tr><td>丁</td><td>80</td><td>0</td><td>24h / 24h</td><td>10</td></tr>
</tbody></table></div>
<form id="gate"><label>筛选阈值 <input id="threshold" type="number" min="0" step="0.01" value="13.4" required aria-label="倍数阈值"> 倍</label><button id="calculate">揭晓并验算</button> <button type="button" class="secondary" id="reset">隐藏结果</button></form>
<div class="scroll" id="answer" hidden><table><thead><tr><th>作者</th><th>倍数</th><th>结论</th><th>依据</th></tr></thead><tbody id="results"></tbody></table></div>
<h2>可复制：第一条任务消息</h2><textarea id="prompt" readonly>你是我的「同行更新员」，只做本次数据初筛。先复述目标、数据口径和停手点，等我确认后再处理。只用我给的四行样例，不查全网。使用同一作者、同一平台、发布后 24 小时的点赞。先核对历史样本至少 5 条、窗口一致、历史中位数大于 0；只有口径合格才用本帖点赞除以历史中位数，按 13.4× 阈值初筛。结果按作者、倍数、结论、证据或缺口四列输出；不补数据，不代发，不改源表。</textarea>
<p><button class="secondary" id="copy" type="button">复制任务消息</button>　<a href="./?slide=4">返回演示第 4 页</a></p><div class="status" id="status" aria-live="polite"></div></main>
<script>
const data=[['甲',550,40,24,24,10],['乙',5000,5000,24,24,10],['丙',900,60,48,24,10],['丁',80,0,24,24,10]];
const form=document.getElementById('gate'), answer=document.getElementById('answer'), body=document.getElementById('results');
form.addEventListener('submit',ev=>{
 ev.preventDefault(); const threshold=Number(document.getElementById('threshold').value);
 body.replaceChildren();
 for(const [author,current,median,h,bh,n] of data){
  let verdict,why,ratio='—';
  if(h!==bh){verdict='待核';why='窗口不齐（'+h+'h / '+bh+'h）';}
  else if(n<5){verdict='待核';why='样本不足';}
  else if(median<=0){verdict='待核';why='基线为零';}
  else{const r=current/median;ratio=r.toFixed(2)+'×';verdict=r>=threshold?'入选':'不入选';why=current+' ÷ '+median;}
  const tr=document.createElement('tr'); for(const val of [author,ratio,verdict,why]){const td=document.createElement('td');td.textContent=val;if(val==='入选')td.className='valid';tr.append(td);}body.append(tr);
 }
 answer.hidden=false;
});
document.getElementById('reset').addEventListener('click',()=>{answer.hidden=true;document.getElementById('threshold').value='13.4';});
document.getElementById('copy').addEventListener('click',async()=>{
 const ta=document.getElementById('prompt');const status=document.getElementById('status');
 try{await navigator.clipboard.writeText(ta.value);status.textContent='已复制。';}catch{ta.focus();ta.select();status.textContent='任务消息已选中，按 Ctrl+C 或 ⌘C 复制。';}
});
</script></body></html>
